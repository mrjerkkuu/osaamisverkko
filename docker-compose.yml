services:
  app:
    build: .
    ports:
      - '3002:3002'
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:latest
    ports:
      - '7474:7474' # HTTP (Käyttöliittymä)
      - '7687:7687' # Bolt (Koodia varten)
    environment:
      - NEO4J_AUTH=neo4j/password
